<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9f1d1d">
<title>All Aboard!</title>
<style>
:root{--train:#9f1d1d;--carriage:#f8d7cf;--bg:#f4efe6;--ink:#1b2430;--accent:#0e6b4c;--card:#fffdf8;--focus:#0b57d0;--line:#1b2430}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;min-height:64px;padding:14px 18px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}
button.primary{background:var(--accent);color:#fffdf8;border-color:#084832}
button.secondary{background:var(--card)}
button.wild{min-height:56px;background:#fff6d8}
button.wild.on,button.choice:focus-visible,button.strategy:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
a{color:#083e86}
.skip{position:absolute;left:8px;top:-40px;background:#fff;padding:8px}
.skip:focus{top:8px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding:18px 18px 8px;flex-wrap:wrap}
.eyebrow{margin:0;letter-spacing:.08em;text-transform:uppercase;font-size:13px;font-weight:800;color:var(--train)}
h1{margin:0;font-size:clamp(36px,6vw,56px);line-height:1}
h2{margin:12px 0 8px;font-size:28px}
h3{margin:8px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{font-weight:800;font-size:16px}
select{min-height:52px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:8px}
.clock{min-width:4.2em;margin:0;font-weight:900;font-variant-numeric:tabular-nums;font-size:28px}
main{max-width:980px;margin:0 auto;padding:8px 18px 48px}
.lead,.hint{color:#243044}
.steps{padding-left:1.2em}
.panel,.banner,.stat{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.banner{background:#fff6d8}
.prompt,.check-line{font-size:clamp(26px,4vw,36px);font-weight:900;margin:8px 0}
.check-line{background:#e7f6ef;border-radius:18px;padding:16px}
.tick{display:flex;gap:12px;align-items:center;margin:10px 0;font-weight:700}
.tick input{width:28px;height:28px;flex:none}
.choices,.strategies,.train,.row,.stats{display:flex;flex-wrap:wrap;gap:12px}
.cardface{min-width:148px;min-height:150px;border:3px solid var(--line);border-radius:18px;background:var(--carriage);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cardface.engine{background:var(--train);color:#fffdf8}
.cardface.held{box-shadow:inset 0 0 0 4px var(--accent)}
.cardface.hero{width:min(100%,280px);min-height:220px;margin:8px auto}
.cardface .emoji{font-size:52px;line-height:1}
.cardface strong{font-size:32px}
.cardface small{font-size:14px}
button.choice{padding:0;background:transparent;border:0;min-height:0}
.action-label{display:block;font-weight:800;margin-top:4px}
.strategy{width:min(100%,280px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.strategy-art{width:120px;height:90px;display:block}
.strategy-art svg,.strategy-art img{width:120px;height:90px;display:block}
.cover{min-height:50vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.stat{min-width:140px;text-align:center}
.stat strong{display:block;font-size:36px}
.listener{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px}
footer{padding:8px 18px 28px;color:#243044;font-size:16px}
#print-sheet{display:none}
@media(max-width:700px){.cardface{min-width:120px}.tools{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
@media print{
  body{background:#fff;color:#000}
  .top,main,footer,.skip{display:none!important}
  #print-sheet{display:block}
  .sheet{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .paper-card{break-inside:avoid;border:2px solid #111;border-radius:4mm;min-height:58mm;padding:5mm;margin:0 0 6mm}
  .paper-card.engine{border-width:5px}
  .paper-card .word{font-size:32px;font-weight:900;margin:4px 0}
  .paper-card .emoji{font-size:42px;margin:0}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header class="top">
  <div>
    <p class="eyebrow">Speech sounds</p>
    <h1>All Aboard!</h1>
  </div>
  <div class="tools">
    <label>Level <select id="level" aria-label="Practice level"></select></label>
    <p id="clock" class="clock" hidden>4:00</p>
    <button type="button" id="music" aria-pressed="false">Music off</button>
    <button type="button" id="print">Print cards</button>
    <button type="button" id="end" hidden>Finish round</button>
  </div>
</header>
<main id="main">
  <p id="live" role="status" aria-live="polite"></p>
  <section id="setup"></section>
  <section id="play" hidden></section>
  <section id="done" hidden></section>
</main>
<footer>
  <p>Generic demo trains only. A host app can pass a private config. Nothing from the round is stored in this page.</p>
  <p><a href="../../../">Therapy Games</a> · <a href="../../../catalogue.html">Game catalogue</a></p>
</footer>
<section id="print-sheet" aria-hidden="true"></section>
