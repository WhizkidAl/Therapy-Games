<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4572e">
<title>All Aboard!</title>
<style>
:root{
  --red:#d7263d;--red-deep:#8f1828;--gold:#f6c445;--cream:#fff6ea;--ink:#3b241c;
  --card:#fffdf8;--green:#1f8a4c;--orange:#e37b12;--sky:#ffe7c2;--focus:#0b57d0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  font:20px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fff 0, transparent 28%),
    linear-gradient(#ffe7c2 0%, #fff6ea 42%, #f3d7a4 100%);
}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.top{display:flex;gap:12px;align-items:center;padding:10px 14px 0}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.mascot{width:72px;height:64px}
.mascot svg{width:100%;height:100%}
.eyebrow{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
h1{margin:0;font-size:clamp(32px,5vw,52px);line-height:.95}
.tools{display:flex;gap:8px;align-items:center}
.clock{margin:0;min-width:3.2em;font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.tools button,.tiny{
  min-height:52px;border-radius:999px;border:3px solid var(--ink);
  background:#fff;font-weight:800;padding:8px 14px;
}
#stage{padding:8px 14px 18px}
.play{display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 86px);min-height:0}
.grid{display:grid;grid-template-columns:1fr;gap:8px;flex:1;min-height:0;align-items:start}
.tracks{min-height:0;overflow:auto}
.tracks{display:flex;flex-direction:column;gap:8px;justify-content:center}
.train{display:flex;align-items:flex-end;gap:6px;background:linear-gradient(#c9844a,#8a5a32);border-radius:18px;padding:8px 8px 10px;position:relative}
.train:after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:4px;background:#3b241c;border-radius:4px}
.loco{width:92px;flex:none}
.loco svg{width:100%;height:auto;display:block}
.cars{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.slot{width:62px;height:64px;border-radius:12px;background:#fff6ea;border:3px dashed #8f1828;flex:none;display:grid;place-items:center;position:relative}
.slot.filled{border-style:solid;background:#fff;border-color:var(--red)}
.slot svg{width:52px;height:46px}
.slot.just{animation:slide .45s ease}
.puff{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:28px;top:8px;animation:puff .7s ease forwards}
.pup-card{background:#fffdf8;border:3px solid var(--ink);border-radius:22px;padding:8px;text-align:center}
.pup-card svg{width:120px;height:100px}
.pup-name{margin:0;font-weight:900;color:var(--red)}
.backs{height:72px;position:relative;margin:8px auto 0;width:96px}
.back{position:absolute;width:52px;height:70px;border-radius:10px;background:#d7263d;border:3px solid #6e1220;box-shadow:inset 0 0 0 6px #f6c445;top:0}
.back:nth-child(2){left:12px}
.back:nth-child(3){left:24px}
.back:nth-child(4){left:36px}
.count{margin:4px 0 0;font-weight:900}
.ask h2,.hand h2{margin:0 0 6px;font-size:18px}
.ask-row,.hand-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pic{
  min-width:118px;min-height:128px;border-radius:20px;border:4px solid var(--ink);
  background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;box-shadow:0 6px 0 #e7c8a0;
}
.pic svg{width:78px;height:68px}
.hero{width:min(100%,260px);margin:0 auto}
.hero svg{width:120px;height:104px}
.pic:active{transform:translateY(3px);box-shadow:0 3px 0 #e7c8a0}
.hand,.ask{flex:none}
.hand-row{justify-content:center;min-height:0;overflow:visible;padding:4px 0 10px}
.hand-card{min-width:88px;min-height:104px;margin:0 -8px;transform:rotate(var(--tilt));font-size:18px}
.hand-card svg{width:58px;height:50px}
.note{display:block;font-size:14px;font-weight:700}
.overlay{
  position:fixed;inset:0;background:rgba(59,36,28,.35);
  display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5;
}
.sheet{
  width:min(860px,100%);background:var(--cream);border:4px solid var(--ink);border-radius:28px;
  padding:16px;box-shadow:0 16px 0 rgba(59,36,28,.15);max-height:92dvh;overflow:auto;
}
.sheet h2{margin:0 0 8px;font-size:clamp(28px,4vw,40px)}
.check{font-size:clamp(26px,4vw,40px);font-weight:900;background:#e5f6ea;border-radius:18px;padding:12px 14px;margin:8px 0}
.pair{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.win .go{min-height:72px;min-width:220px;font-size:28px;padding:10px 22px;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row button,.stack button{flex:1;min-width:140px;min-height:84px;border-radius:22px;border:4px solid var(--ink);font-size:28px;font-weight:900}
.go{background:var(--green);color:#fff}
.mix{background:var(--orange);color:#fff}
.fix{background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;padding:8px}
.fix svg{width:72px;height:64px}
.parent{font-size:16px;font-weight:700}
.win{text-align:center}
.win .cast{display:flex;justify-content:center;gap:8px}
.win .cast svg{width:140px;height:120px}
.tickets{display:flex;gap:8px;justify-content:center;margin:10px 0}
.ticket{width:72px;height:40px;border-radius:8px;background:var(--gold);border:3px solid var(--ink);transform:rotate(var(--tilt))}
.away{animation:drive 1.1s ease forwards}
.bits{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.bit{position:absolute;top:-20px;width:14px;height:18px;border-radius:3px;animation:fall 1.2s linear forwards}
.grown{display:grid;gap:8px}
.grown label{font-weight:800;display:flex;gap:8px;align-items:center}
.grown select{min-height:48px;border-radius:12px;border:3px solid var(--ink);background:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (orientation:landscape) and (min-width:800px){
  .grid{grid-template-columns:1fr 210px;align-items:stretch}
  .overlay{align-items:center}
}
@media (max-width:700px){
  .pic{min-width:118px;min-height:142px;font-size:22px}
  .row button{min-height:76px;font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  .slot.just,.away,.puff,.bit{animation:none!important}
}
@keyframes slide{from{transform:translateX(-28px);opacity:.2}to{transform:none;opacity:1}}
@keyframes puff{to{transform:translate(-18px,-26px) scale(1.6);opacity:0}}
@keyframes drive{to{transform:translateX(120%)}}
@keyframes fall{to{transform:translateY(100dvh) rotate(80deg);opacity:.2}}
@media print{
  .top,#stage,.bits{display:none!important}
  #print-sheet{display:block}
  .sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .paper{break-inside:avoid;border:2px solid #111;border-radius:6mm;padding:4mm;text-align:center}
  .paper svg{width:40mm;height:34mm}
  .paper strong{display:block;font-size:28px}
}
#print-sheet{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div id="pig" class="mascot"></div>
    <div>
      <p class="eyebrow">Red trains</p>
      <h1>All Aboard!</h1>
    </div>
  </div>
  <div class="tools">
    <p id="clock" class="clock" aria-live="off">4:00</p>
    <button type="button" id="mute" aria-pressed="true">Sound on</button>
    <button type="button" id="grown">Grown-ups</button>
  </div>
</header>
<p id="live" class="sr" role="status" aria-live="polite"></p>
<main id="stage"></main>
<section id="print-sheet" aria-hidden="true"></section>
