<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whiz Kids · Help and comeback lines</title><style>*{box-sizing:border-box}body{margin:0;background:#eff4fb;color:#20345d;font:21px/1.5 Arial,sans-serif}header{background:#20345d;color:white;padding:22px}main{max-width:1050px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}a.card,button{display:block;background:white;color:#20345d;border:3px solid #3b78be;border-radius:18px;padding:20px;text-decoration:none;font:inherit;text-align:center;cursor:pointer;min-height:60px}.card span{display:block;font-size:60px}.card strong{display:block;font-size:25px}a:focus-visible,button:focus-visible{outline:5px solid #bc68d8;outline-offset:4px}.panel{padding:20px;background:white;border-radius:18px;margin:20px 0}.small{font-size:17px}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions a{color:#20345d}h1{margin:0}button{margin:12px 0;width:100%}#responses button{text-align:left}nav{padding:15px 0}nav a{color:#20345d}#scene-picture{font-size:90px;text-align:center}</style></head><body><header><h1>💬 Help and comeback lines</h1><p>Listen. Choose something I could say.</p></header><main><nav><a href="speech-room.html">← Speech choices</a></nav><section class="panel"><p id="position"></p><div id="scene-picture" aria-hidden="true"></div><h2 id="scenario"></h2><button id="listen">🔊 Hear the situation</button><div id="responses"></div><p id="response" role="status"></p><div class="actions"><button id="previous">← Back</button><button id="next">Next →</button></div></section><p>There can be several useful answers. I can choose my own words too.</p><p>Finished? Return to your saved START page to tell how it went and ask an adult to approve one coin.</p><nav><a href="speech-room.html">← Back to Speech choices</a></nav></main><script>const scenes=[["🧩","The instructions are confusing. What could I say?",["Please show me.","What do you mean?","Can we try another way?"]],["⏳","Someone asks me to answer before I am ready. What could I say?",["I need more time.","Please wait.","Please show me."]],["🌳","I feel tired or overwhelmed. What could I say?",["I need a break.","Can you help me?","I want to stop."]],["💬","Someone says something unkind. What could I say?",["Please stop.","I need help.","I can tell a trusted adult."]]];let index=0;const el=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window)){el('response').textContent='Ask an adult to read this with you.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-AU';speechSynthesis.speak(u)}function render(){const [pic,q,answers]=scenes[index];el('position').textContent=(index+1)+' / '+scenes.length;el('scene-picture').textContent=pic;el('scenario').textContent=q;el('response').textContent='';el('responses').replaceChildren();for(const a of answers){const b=document.createElement('button');b.textContent='🔊 '+a;b.onclick=()=>{say(a);el('response').textContent='💬 '+a};el('responses').append(b)}el('previous').disabled=index===0;el('next').disabled=index===scenes.length-1}el('listen').onclick=()=>say(scenes[index][1]);el('previous').onclick=()=>{index--;render()};el('next').onclick=()=>{index++;render()};window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});render();</script></body></html>
