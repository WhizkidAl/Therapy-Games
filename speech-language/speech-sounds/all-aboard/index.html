<style>

.week{margin-top:10px}

.cars > div{overflow:visible}

.find-board{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}

body[data-screen="award"] .world{padding-bottom:26vh}
body[data-screen="award"] .world.sheet #stage{margin:8px 18% 0 16%}
.tickets{text-align:center}

/* Review v3: one upright card per carriage, aligned wheels and a smaller engine. */

.response-form{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;background:#fff8df;border-radius:12px;padding:7px;width:100%}.response-form .response-label{padding:0}.response-form #note-status{width:100%;font-size:13px;text-align:center}
.word-set{border-radius:12px;flex-wrap:wrap}.word-set #word-status{font-size:12px}
.raw-records>summary,.sess>summary,.ticket-reset>summary{cursor:pointer;font-weight:bold;padding:10px;border-radius:8px;background:#eef2f8}.raw-records{margin:16px 0}.progress-summary{background:#fff;border-radius:16px;padding:16px}.summary-headline{font-size:21px!important;font-weight:bold}.support-bars{max-width:550px}.support-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.support-row meter{width:100%;height:22px}
.awaiting-card .find-card:not(.gone),.awaiting-strategy .strat:not(.done){animation:choose-wiggle 7s ease-in-out 2s infinite}
@keyframes choose-wiggle{0%,12%,100%{transform:rotate(0)}2%,6%,10%{transform:rotate(-3deg)}4%,8%{transform:rotate(3deg)}}
#celebration{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}#celebration i{position:absolute;width:9px;height:9px;border-radius:50%;animation:burst 1.2s ease-out both;box-shadow:0 0 6px currentColor}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.awaiting-card .find-card:not(.gone),.awaiting-strategy .strat:not(.done){animation:none;outline:3px solid #e5b748}}
body[data-screen="r3"] .play-main{gap:8px}body[data-screen="r3"] .fit .float-card{width:85px}.response-form .nav-btn{min-height:40px}


/* Keep collected cards in their own train area, clear of choices. */
.stood{height:12vh;max-height:110px;width:auto;max-width:56%;object-fit:contain;left:50%;transform:translateX(-50%);bottom:94%}
body[data-screen="r2"] #stage,body[data-screen="r3"] #stage{overflow:auto;align-items:flex-start;padding:6px}
body[data-screen="r2"] .playfield,body[data-screen="r3"] .playfield{height:auto;min-height:100%;align-items:start}
body[data-screen="r2"] .play-main{display:grid;grid-template-columns:minmax(100px,170px) minmax(240px,1fr);align-items:center;gap:10px}
body[data-screen="r2"] .pic-only{grid-column:1;width:100%;max-width:170px}
body[data-screen="r2"] .play-main>.nav-btn{grid-column:1;grid-row:2}
body[data-screen="r2"] .tiles{grid-column:2;grid-row:1 / span 2;grid-template-columns:repeat(4,minmax(48px,1fr))}
.sound-summary{border:2px solid #d6dfeb;border-radius:12px;padding:12px;margin:12px 0}.sound-summary h4{font-size:21px;margin:0 0 10px}.sound-table-wrap{overflow:auto}.sound-table{width:100%;border-collapse:collapse;font-size:14px}.sound-table th,.sound-table td{padding:9px 6px;border-bottom:1px solid #d6dfeb;text-align:left}.sound-table thead,.sound-table tr:first-child{background:#edf2f8}
@media(max-width:900px){body[data-screen="r2"] .playfield{grid-template-columns:1fr}body[data-screen="r2"] .play-side{justify-self:center}body[data-screen="r3"] .playfield{display:block}body[data-screen="r3"] .play-main.rowish{flex-wrap:wrap}body[data-screen="r3"] .strats{flex-wrap:wrap;justify-content:center}}
@media(max-width:540px){body[data-screen="r2"] #stage,body[data-screen="r3"] #stage{margin-right:8px}body[data-screen="r2"] .play-main{grid-template-columns:1fr}body[data-screen="r2"] .pic-only{justify-self:center;max-width:90px}body[data-screen="r2"] .tiles{grid-column:1;grid-row:3}body[data-screen="r2"] .play-main>.nav-btn{justify-self:center}.sound-table{font-size:12px}}
</style>
</head>
