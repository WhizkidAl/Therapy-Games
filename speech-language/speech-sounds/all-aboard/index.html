<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f0">
<title>All Aboard!</title>
<style>
@font-face{font-family:Fredoka;src:url("assets/fredoka-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Fredoka;src:url("assets/fredoka-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--ink:#24315c;--red:#e23b3b;--green:#2f9e4f;--gold:#f6c445}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#8fd4f5}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible,a:focus-visible{outline:4px solid #0b57d0;outline-offset:3px}
.world{position:relative;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);padding-bottom:16vh;background:#8fd4f5}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:0;pointer-events:none}
.booth{position:absolute;right:0;top:8vh;width:23%;z-index:3;pointer-events:none}
.pup{position:absolute;right:2.6%;top:11vh;width:14.5%;z-index:6;pointer-events:none}
.pig{position:absolute;left:0.2%;bottom:24vh;width:13.5%;z-index:4;pointer-events:none}
.train{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
.cars{display:flex;align-items:flex-end;flex:1;min-width:0}
.cars > div{flex:1 1 0;min-width:0;position:relative}
.carriage{width:100%;height:auto;display:block}
.engine{width:29%;height:auto;flex:0 0 auto;margin-right:8px}
.hud{position:relative;z-index:8;padding:8px 10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.title{flex:1 1 220px;min-width:220px;background:#e23b3b;color:#fff;border-radius:999px;text-align:center;font-size:clamp(18px,2.4vw,40px);padding:8px 16px;border:4px solid #fff;box-shadow:0 4px 0 #8f1828}
.ticket-pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 10px;border:3px solid var(--ink);font-weight:700;font-size:20px}
.ticket-pill img{height:32px}
.grown-btn{flex:0 0 auto;background:#2a3f73;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;min-height:46px}
.grown-btn[hidden]{display:none}
.dad{flex:0 0 auto;display:flex;gap:6px;align-items:center;background:#2a3f73;color:#fff;border-radius:999px;padding:4px 6px 4px 10px}
.dad[hidden]{display:none}
.dad span{font-weight:700;padding:0 2px}
.dad button{background:#fff;color:var(--ink);border-radius:999px;min-height:40px;padding:6px 10px;font-weight:700;font-size:15px}
.dad button.go{background:#d9f5df}
.dad label{display:flex;gap:6px;align-items:center;font-size:13px;line-height:1.15;max-width:118px}
.dad input{width:20px;height:20px;flex:0 0 auto}
#stage{position:relative;z-index:6;min-height:0;height:100%;margin:4px 26% 0 8px;display:flex;align-items:center;justify-content:center}
.world.sheet{padding-bottom:12vh}
.world.sheet #stage{margin:4px 2% 0 2%}
body[data-screen="home"] #stage{margin-left:15%;margin-right:26%}
body[data-screen="yay"] #stage{margin-left:16%;margin-right:24%}
body[data-screen="tickets"] .world,body[data-screen="rate"] .world{padding-bottom:26vh}
body[data-screen="tickets"] .world.sheet #stage,body[data-screen="rate"] .world.sheet #stage{margin:8px 18% 0 16%}
body[data-phase="help"] .world #stage{margin-right:8px}
body[data-phase="help"] .booth,body[data-phase="help"] .pup{visibility:hidden}
.play-btn{background:#2f9e4f;color:#fff;font-size:clamp(34px,4.6vw,56px);border-radius:24px;padding:14px 48px;border:5px solid #fff;box-shadow:0 8px 0 #1c6b34;min-width:220px}
.playfield{display:grid;grid-template-columns:minmax(0,1fr) minmax(148px,188px);gap:8px;width:100%;height:100%;align-items:center}
.playfield.wide{grid-template-columns:minmax(0,1fr) minmax(260px,440px)}
.play-main{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.play-main.rowish{flex-direction:row;align-items:center}
.play-side{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;align-self:center;position:relative;z-index:7}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;width:100%;align-items:stretch}
.back{flex:1 1 0;width:0;max-width:210px;min-width:0;aspect-ratio:3/4;background:#e23b3b;border:6px solid #f6c445;border-radius:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(20px,2.6vh,32px);font-weight:700;box-shadow:0 6px 0 #8f1828;position:relative;overflow:hidden}
.back.face{background:#fff;border:8px solid #fff;color:var(--ink);box-shadow:0 10px 18px #24315c2e}
.back.face img{width:100%}
.back img{width:68%;height:auto}
.back.on{outline:5px solid #0b57d0}
.onsets{display:flex;gap:12px;justify-content:center}
.onset{width:clamp(58px,9vh,76px);height:clamp(58px,9vh,76px);border-radius:50%;color:#fff;font-size:clamp(22px,3vh,30px);font-weight:700;border:4px solid #fff;position:relative}
.onset.used{filter:grayscale(.4)}
.onset.used:after{content:"✓";position:absolute;right:-4px;top:-6px;background:#fff;color:#1c6b34;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:22px}
.bubble{background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 #d5d8df;max-width:176px}
.say{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:100%}
.mouth{background:#fff;border:3px solid #e23b3b;color:#e23b3b;border-radius:999px;padding:6px 12px;font-weight:700}
.panel{background:#fffaf2;border:6px solid #e23b3b;border-radius:28px;padding:14px 16px;height:auto;max-height:100%;overflow:auto;width:100%}
.panel h2{margin:0 0 8px;color:#e23b3b;font-size:clamp(26px,3vw,36px)}
.levels,.trains{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.level,.train-pick{background:#fff;border:3px solid #d5d8df;border-radius:16px;padding:8px;text-align:center}
.level.on{border-color:#f6c445;background:#fff8df}
.level img{height:40px}
.level b{display:block;font-size:22px}
.frame{display:block;margin-top:6px;background:#2a3f73;color:#fff;border-radius:999px;padding:6px 8px}
.level:not(.on) .frame{background:#fff;color:var(--ink);border:2px solid #d5d8df}
.note{font-size:14px;color:#5c6b8a}
.shop{margin-top:10px;display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;border:3px solid #d5d8df}
.shop img{height:42px}
.switch{width:64px;height:34px;border-radius:999px;background:#c5c9d4;position:relative}
.switch.on{background:#2f9e4f}
.switch i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on i{left:33px}
.hint{background:#2a3f73;color:#fff;border-radius:20px;padding:12px;width:100%;max-height:100%}
.hint h3{margin:0 0 8px}
.model{background:#fff8df;color:var(--ink);border-radius:12px;padding:8px;font-size:28px;text-align:center}
.split{display:flex;gap:8px;align-items:center;justify-content:center}
.chip{background:#f0a202;color:#fff;border-radius:12px;padding:8px 14px;font-size:24px;font-weight:700}
.chip.dark{background:#2a3f73}
.yay{background:#2f9e4f;color:#fff;font-size:clamp(26px,4vw,42px);border-radius:999px;padding:10px 22px;border:4px solid #fff;text-align:center}
.float-card{width:clamp(140px,26vh,240px);margin:0;background:#fff;border:8px solid #fff;border-radius:18px;text-align:center;font-weight:700;padding:0;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 10px 18px #24315c2e}
.float-card img{width:100%;height:auto;display:block}
.float-card:after,.pic-only:after,.back.face:after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(#ffffffc4,#ffffff00);pointer-events:none}
.help-btn{background:#fff;border-radius:999px;min-height:48px;padding:8px 14px;font-weight:700;border:3px solid var(--ink)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.q b{background:#e23b3b;color:#fff;border-radius:10px;padding:8px}
.q b:nth-child(4n+3){background:#f0a202}
.q b:nth-child(4n+1){background:#3d6fd6}
.q b:nth-child(4n){background:#2f9e4f}
.q span{background:#fff;color:var(--ink);border-radius:10px;padding:8px}
.tiles{display:grid;grid-template-columns:repeat(4,clamp(52px,8vh,74px));gap:8px;justify-content:center}
.tile{height:clamp(48px,7.4vh,68px);border-radius:14px;background:#fff8df;border:4px solid #2a3f73;font-size:clamp(20px,3vh,26px);font-weight:700;color:var(--ink)}
.tile.bad{animation:wiggle .25s}
.pic-only{width:clamp(150px,28vh,240px);background:#fff;border:8px solid #fff;border-radius:18px;padding:0;text-align:center;flex:0 0 auto;position:relative;overflow:hidden;box-shadow:0 10px 18px #24315c2e}
.pic-only img{width:100%;height:auto}
.strats{display:flex;gap:8px;align-items:stretch}
.strat{width:clamp(108px,16vh,160px);border-radius:16px;overflow:hidden;background:#fff;border:4px solid #d5d8df;padding:0;flex:0 0 auto;position:relative}
.fit .float-card{width:112px}
.strat.key{border-color:#3d8ee8}
.strat.show{border-color:#e0b43a}
.strat.way{border-color:#2f9e4f}
.strat.on{outline:4px solid #0b57d0}
.strat.done{box-shadow:0 0 0 3px #2f9e4f}
.strat img{width:100%;height:auto;display:block}
.strat .pip{position:absolute;left:16.5%;top:26%;width:20%;height:33%;object-fit:contain;border-radius:50%;background:#fff8e6}
.strat .tick{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:#2f9e4f;color:#fff;font-size:18px;line-height:28px;text-align:center}
.got{background:#2f9e4f;color:#fff;border-radius:999px;min-height:52px;padding:8px 22px;font-weight:700;font-size:22px;border:4px solid #fff}
.word-set{flex:1 1 100%;display:flex;justify-content:flex-end;align-items:center;gap:8px;background:#2a3f73;color:#fff;border-radius:999px;padding:4px 8px 4px 14px;font-weight:700}
.word-set[hidden]{display:none}
.word-set input{border:0;border-radius:999px;min-height:36px;padding:4px 12px;font:inherit;width:min(42vw,220px);color:var(--ink)}
.count-pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;margin:0}
.nav-btn{background:#2a3f73;color:#fff;border-radius:999px;min-height:44px;padding:8px 14px;font-weight:700}
.rounds{display:flex;gap:8px}
.round-pick{flex:1;background:#fff;border:3px solid #d5d8df;border-radius:14px;min-height:48px;font-weight:700}
.round-pick.on{border-color:#f6c445;background:#fff8df}
.nav-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.album-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.slot{background:#fff;border-radius:10px;padding:3px;text-align:center;font-size:11px;font-weight:700;color:#5c6b8a}
.slot img{width:100%;height:36px;object-fit:contain}
.slot.wait img{filter:grayscale(1);opacity:.35}
.how p,.sess{text-align:left;font-size:16px;line-height:1.35}
.sess{background:#fff;border-radius:12px;padding:8px 10px;margin-top:6px}
.week{margin-top:10px}
.play-btn.slim{font-size:22px;padding:8px 16px;min-width:0;box-shadow:0 4px 0 #1c6b34}
.car-window{position:absolute;left:15%;width:70%;top:14%;height:34%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.car-window img{width:90%;height:90%;object-fit:contain;background:#fff;border-radius:4px}
body[data-screen="award"] .world{padding-bottom:26vh}
body[data-screen="award"] .world.sheet #stage{margin:8px 18% 0 16%}
.tickets{text-align:center}
.mystery{display:flex;gap:16px;justify-content:center;margin-top:12px}
.mystery button{background:transparent}
.mystery img{width:min(22vw,180px)}
.faces{display:flex;gap:18px;justify-content:center}
.face{width:clamp(88px,16vh,120px);height:clamp(88px,16vh,120px);border-radius:50%;border:6px solid #fff;font-size:clamp(44px,8vh,64px);box-shadow:0 6px 0 #d5d8df}
.face.yes{background:#2f9e4f}
.face.ok{background:#f6c445}
.face.no{background:#3d6fd6}
.caption{font-weight:700;font-size:22px}
.reveal{background:#fff8df;border-radius:16px;padding:12px;font-size:24px;font-weight:700}
@media (max-height:780px){
  .back{max-width:150px}
  .dad button{font-size:14px;padding:6px 8px}
  .level img{height:36px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@keyframes wiggle{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="world">
  <img class="backdrop" src="assets/bg-station.webp" alt="">
  <img class="booth" src="assets/booth.webp" alt="">
  <img class="pup" src="assets/pup.webp" alt="">
  <img class="pig" id="pig" src="assets/pig.webp" alt="">
  <div class="train" id="train" aria-hidden="true"></div>
  <header class="hud">
    <button type="button" class="grown-btn" id="grown">Grown-ups</button>
    <div class="title" id="title">All Aboard!</div>
    <div class="ticket-pill" id="tickets" aria-live="polite"></div>
    <div class="dad" id="dad" hidden>
      <span>Dad</span>
      <button type="button" id="own">Got it on his own</button>
      <button type="button" id="with">Got it with help</button>
      <label><input type="checkbox" id="split"> needed the sound split off</label>
      <button type="button" id="tips">Tips</button>
    </div>
    <label class="word-set" id="word-set" hidden>Word <input id="word-box" type="text" maxlength="40" aria-label="Word for Round 3"></label>
  </header>
  <div id="stage"></div>
</div>
<p id="live" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden" role="status" aria-live="polite"></p>
<script src="words.js"></script>
<script src="collect.js"></script>
<script src="game.js"></script>
</body>
</html>
