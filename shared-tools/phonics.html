<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whiz Kids — Word tiles</title><style>body{margin:0;background:#f3f6fb;color:#07244a;font:20px/1.5 Arial,sans-serif}header{background:#003b8e;color:white;padding:20px;border-bottom:8px solid #f6c544}main{max-width:1050px;margin:auto;padding:20px}button{font:inherit;cursor:pointer;min-height:56px;min-width:56px;border:2px solid #123957;border-radius:12px;margin:4px;padding:12px}button:focus-visible,a:focus-visible{outline:4px solid #b77800;outline-offset:3px}.word{display:flex;flex-wrap:wrap;min-height:100px;background:white;border:2px solid #003b8e;border-radius:16px;padding:14px;align-items:center;margin:18px 0}.piece{font-size:40px;font-weight:bold;padding:8px 15px;border-radius:10px;margin:4px}.toolbar button{background:white}h2{font-size:23px;margin:22px 0 8px}.hint{font-size:17px}a{color:inherit}@media print{header,.toolbar,.word,.hint,a{display:none}button{border-radius:0;width:40mm;height:40mm;margin:1mm;break-inside:avoid}body{background:white}}</style><header><h1>My word tiles</h1><p>Choose tiles to build a word.</p></header><main><a href="./">Back to learning tools</a><div class="word" id="word" role="status" aria-live="polite" aria-label="Word building area"></div><div class="toolbar"><button id="undo">Remove last tile</button><button id="clear">Clear word</button><button id="print">Print tile reference</button></div><p class="hint">Use the spelling patterns your team has shown you. Tiles can be used more than once. This word clears when you reload the page.</p><div id="tiles"></div></main><script>const tiles=[{"letters": "a", "group": "Single vowels", "colour": "#003B8E"}, {"letters": "b", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "c", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "d", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "e", "group": "Single vowels", "colour": "#003B8E"}, {"letters": "f", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "g", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "h", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "i", "group": "Single vowels", "colour": "#003B8E"}, {"letters": "j", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "k", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "l", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "m", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "n", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "o", "group": "Single vowels", "colour": "#003B8E"}, {"letters": "p", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "q", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "r", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "s", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "t", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "u", "group": "Single vowels", "colour": "#003B8E"}, {"letters": "v", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "w", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "x", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "y", "group": "Vowel use of y", "colour": "#003B8E"}, {"letters": "z", "group": "Single consonants", "colour": "#F6C544"}, {"letters": "ch", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "sh", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "th", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "wh", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "ph", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "ck", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "ng", "group": "Consonant digraphs", "colour": "#007D87"}, {"letters": "tch", "group": "Consonant trigraphs", "colour": "#F5B1A8"}, {"letters": "dge", "group": "Consonant trigraphs", "colour": "#F5B1A8"}, {"letters": "ai", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ay", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ee", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ea", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ie", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "oa", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ow", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "oo", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ou", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "oi", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "oy", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ue", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ew", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "au", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "aw", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "oe", "group": "Vowel teams", "colour": "#BFE3C0"}, {"letters": "ar", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "or", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "er", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "ir", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "ur", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "air", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "ear", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "are", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "ore", "group": "R influenced vowels", "colour": "#D7C2EE"}, {"letters": "qu", "group": "Linked spelling", "colour": "#FFF9ED"}];const area=document.getElementById('word');const chosen=[];function render(){area.replaceChildren();for(const tile of chosen){const s=document.createElement('span');s.className='piece';s.textContent=tile.letters;s.style.background=tile.colour;s.style.color=['#003B8E','#007D87'].includes(tile.colour)?'white':'#07244a';area.append(s)}document.getElementById('undo').disabled=!chosen.length;document.getElementById('clear').disabled=!chosen.length}for(const group of [...new Set(tiles.map(x=>x.group))]){const h=document.createElement('h2');h.textContent=group;document.getElementById('tiles').append(h);const section=document.createElement('section');section.setAttribute('aria-label',group);for(const tile of tiles.filter(x=>x.group===group)){const b=document.createElement('button');b.textContent=tile.letters;b.style.background=tile.colour;b.style.color=['#003B8E','#007D87'].includes(tile.colour)?'white':'#07244a';b.addEventListener('click',()=>{chosen.push(tile);render()});section.append(b)}document.getElementById('tiles').append(section)}document.getElementById('undo').onclick=()=>{chosen.pop();render()};document.getElementById('clear').onclick=()=>{chosen.length=0;render()};document.getElementById('print').onclick=()=>print();render();</script></html>
