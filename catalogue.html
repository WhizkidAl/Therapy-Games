<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Therapy Games catalogue</title>
<style>
:root{--ink:#1b2430;--bg:#f4efe6;--card:#fffdf8;--line:#1b2430;--accent:#0e6b4c;--focus:#0b57d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 16px 64px}
h1{font-size:clamp(34px,5vw,52px);margin:0 0 8px}
a{color:#083e86}
button,select{font:inherit;min-height:48px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:8px 12px}
button{font-weight:800;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
article{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px}
article h2{margin:0 0 8px;font-size:24px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:2px solid var(--line);border-radius:999px;padding:2px 8px;font-size:13px;font-weight:800}
.meta{font-size:15px;margin:4px 0}
.note{font-size:15px}
.status{font-weight:900}
.empty{padding:16px;background:#fff6d8;border-radius:12px}
</style>
</head>
<body>
<main>
  <p><a href="./">Therapy Games</a></p>
  <h1>Game catalogue</h1>
  <p>Read-only list of the games and tools in this repository. Status <strong>built</strong> means the page exists. It does not mean the tool has been clinically reviewed or released.</p>
  <div class="filters">
    <label>Area <select id="area"><option value="">All areas</option></select></label>
    <label>Presentation <select id="tag"><option value="">All tags</option></select></label>
    <label>Status <select id="status"><option value="">All statuses</option></select></label>
    <label>Repair <select id="repair"><option value="">Any</option><option value="yes">Supports repair</option><option value="no">No repair step</option></select></label>
    <button type="button" id="clear">Clear filters</button>
  </div>
  <p id="count" role="status"></p>
  <div id="list" class="grid"></div>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let games = [];
  function option(select, value) {
    const el = document.createElement('option');
    el.value = value;
    el.textContent = value;
    select.append(el);
  }
  function fill(select, values) {
    values.slice().sort().forEach((value) => option(select, value));
  }
  function show(items) {
    const list = $('list');
    list.replaceChildren();
    $('count').textContent = items.length + (items.length === 1 ? ' entry' : ' entries');
    if (!items.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'Nothing matches these filters.';
      list.append(empty);
      return;
    }
    items.forEach((game) => {
      const card = document.createElement('article');
      const title = document.createElement('h2');
      const link = document.createElement('a');
      link.href = game.path;
      link.textContent = game.title;
      title.append(link);
      card.append(title);
      const tags = document.createElement('div');
      tags.className = 'tags';
      const bits = [game.therapyArea, game.status].concat(game.presentationTags);
      if (game.supports_repair) bits.push('supports-repair');
      bits.forEach((bit) => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = bit;
        tags.append(tag);
      });
      card.append(tags);
      if (game.summary) {
        const summary = document.createElement('p');
        summary.textContent = game.summary;
        card.append(summary);
      }
      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = 'Version ' + game.version + ' · updated ' + game.lastUpdated + ' · configurable ' + (game.configurable ? 'yes' : 'no') + ' · levels ' + (game.levelsSupported.length ? game.levelsSupported.join(', ') : 'none listed');
      card.append(meta);
      if (game.statusNote) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = game.statusNote;
        card.append(note);
      }
      list.append(card);
    });
  }
  function apply() {
    const area = $('area').value;
    const tag = $('tag').value;
    const status = $('status').value;
    const repair = $('repair').value;
    show(games.filter((game) => {
      if (area && game.therapyArea !== area) return false;
      if (tag && !game.presentationTags.includes(tag)) return false;
      if (status && game.status !== status) return false;
      if (repair === 'yes' && !game.supports_repair) return false;
      if (repair === 'no' && game.supports_repair) return false;
      return true;
    }));
  }
  fetch('catalogue.json').then((response) => {
    if (!response.ok) throw new Error('The catalogue file did not load.');
    return response.json();
  }).then((data) => {
    games = data.games || [];
    fill($('area'), [...new Set(games.map((game) => game.therapyArea))]);
    fill($('tag'), [...new Set(games.flatMap((game) => game.presentationTags))]);
    fill($('status'), [...new Set(games.map((game) => game.status))]);
    ['area', 'tag', 'status', 'repair'].forEach((id) => $(id).addEventListener('change', apply));
    $('clear').addEventListener('click', () => {
      ['area', 'tag', 'status', 'repair'].forEach((id) => { $(id).value = ''; });
      apply();
    });
    apply();
  }).catch((error) => {
    $('count').textContent = error.message;
  });
})();
</script>
</body>
</html>
