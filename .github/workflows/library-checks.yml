name: Library checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalogue-and-games:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the catalogue and All Aboard config
        run: node --test
